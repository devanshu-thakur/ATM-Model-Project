<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pg2</title>

<style>
body { 
  margin: 0; 
  padding: 0; 
  overflow: hidden; 
  width: 100vw;
  height: 100vh;
} 

.atm-container { 
  position: relative; 
  display: block; 
  width: 100vw; 
  height: 100vh; 
  box-sizing: border-box; 
}

#atmScreen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: fill; 
  z-index: -1;
  display: block;    
}
#atmScreen[status="hidden"]{
    display: none;
}
#bkdetailsbtn{
position: absolute;
left: 9.5%;     /* Adjusted from 58px */
top: 38.03%;      /* Adjusted from 245px */
}
#savingbtn{
position: absolute;
left: 9.5%;     /* Adjusted from 58px */
top: 56.0%;      /* Adjusted from 351px */

}
#currentbtn{
position: absolute;
left: 9.5%;     /* Adjusted from 58px */
top: 72.0%;      /* Adjusted from 351px */
}
.pg2btn{
    position: absolute;
    background-color: red;
    color: white;
    width: 20.0%;      /* Adjust this percentage to control your button width */
    height: 10.0%;      /* Adjust this percentage to control your button height */
    font-size: 2rem;  /* Scaled smoothly relative to the browser width */
    border-radius: 30rem;
}
#pin-img{
position: absolute;
left: 30.9%;     /* Adjusted from 620px */
top: 10%;      /* Adjusted from 361px */
width: 25.0%;    /* Adjust this percentage as needed */
height: 20.0%;    /* Adjust this percentage as needed */
border-radius: 1rem;
display: none;
}
#pin-img[status="show"]{
    display: block;
}
#enter-pin{
    -webkit-text-security: disc;   /*very imp*/
    text-align: center;
    font-size: 2rem;
    background-color: chartreuse;

    position: absolute;
left: 32.8%;     /* Adjusted from 620px */
top: 15.6%;      /* Adjusted from 361px */
width: 21.0%;    /* Adjust this percentage as needed */
height: 7.0%;    /* Adjust this percentage as needed */
border-radius: 1rem;
display: none;
}
#enter-pin[status="show"]{
    display: block;
}
#click{
        position: absolute;
        background-color: rgb(134, 6, 255);
    color: aliceblue;
    font-size: 2rem;
left: 35.9%;     /* Adjusted from 620px */
top: 60%;      /* Adjusted from 361px */
width: 15.0%;    /* Adjust this percentage as needed */
height: 8.0%;    /* Adjust this percentage as needed */
border-radius: 1rem;
    display: none;
}
#click[status="show"]{
    display: block;
}
#alert{
    position: absolute;
    left: 37.8%;     /* Adjusted from 620px */
top: 25.6%;
}

</style>
</head>
<body class="pg2">
    <div class="atm-container">
        <img src="bk2.png" id="atmScreen">
        <button class="pg2btn" id="bkdetailsbtn">Details</button>
        <button class="pg2btn" id="savingbtn">Saving</button>
        <button class="pg2btn" id="currentbtn">Current</button>
        <img src="pin.png" id="pin-img">
        <input type="number" id="enter-pin" placeholder="PIN">
        <button id="click">Wait...</button>
        <h3 id="alert"></h3>
    </div>
</body>
<script src="app.js"></script>
<script>
let pin=1234;
count=1;
    document.querySelector("#savingbtn").addEventListener("click",async()=>{

        document.querySelector("#pin-img").setAttribute("status", "show");
        document.querySelector("#atmScreen").setAttribute("status", "hidden");
        
        document.querySelector("#enter-pin").setAttribute("status", "show");
        await new Promise(r => setTimeout(r, 1000));
        document.querySelector("#click").setAttribute("status", "show");
        await new Promise(r => setTimeout(r, 1000));
        document.querySelector("#click").innerText="Saving-Ac";
        await new Promise(r => setTimeout(r, 2000));
        document.querySelector("#click").innerText="Next";
        document.querySelector("#click").addEventListener("click",async()=>{
            if(Number(document.querySelector("#enter-pin").value)==pin){
                window.location.href="pg3.html"
            }
            else{
                document.querySelector("#alert").innerText = "Incorrect PIN";
                document.querySelector("#enter-pin").value = "";
                await new Promise(r => setTimeout(r, 2000));
                document.querySelector("#alert").innerText = "";
                
                count++;
                if(count==3){
                    window.location.href="index.html";
                }
            }
        
        })
    })
    document.querySelector("#currentbtn").addEventListener("click",async()=>{

        document.querySelector("#pin-img").setAttribute("status", "show");
        document.querySelector("#atmScreen").setAttribute("status", "hidden");
       
        document.querySelector("#enter-pin").setAttribute("status", "show");
        await new Promise(r => setTimeout(r, 1000));
        document.querySelector("#click").setAttribute("status", "show");
        await new Promise(r => setTimeout(r, 1000));
        document.querySelector("#click").innerText="Current";
        await new Promise(r => setTimeout(r, 2000));
        document.querySelector("#click").innerText="Next";
        document.querySelector("#click").addEventListener("click",async()=>{
            if(Number(document.querySelector("#enter-pin").value)==pin){
                window.location.href="pg3.html"
            }
            else{
                document.querySelector("#alert").innerText = "Incorrect PIN";
                document.querySelector("#enter-pin").value = "";
                await new Promise(r => setTimeout(r, 2000));
                document.querySelector("#alert").innerText = "";
                
                count++;
                if(count==3){
                    window.location.href="index.html";
                }
            }
        
        })
    })
    document.querySelector("#bkdetailsbtn").addEventListener("click",()=>{
        window.location.href="details.html"
    })
</script>
<!-- ATM PIN is 1234. -->
</html>
