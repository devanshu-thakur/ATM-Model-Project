<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>credit</title>
    <style>
        body { 
  margin: 0; 
  padding: 0; 
  overflow: hidden; 
  width: 100vw;
  height: 100vh;
} 

.atm-container { 
  position: relative; 
  display: block; 
  width: 100vw; 
  height: 100vh; 
  box-sizing: border-box; 
}

#atmScreen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: fill; 
  z-index: -1;      
}
#credit-text{
    position: absolute;
    color: white;
    background-color: chocolate;
    left: 10.3%;     /* Adjusted from 696px */
    top: 30.7%;      /* Adjusted from 790px */
    font-size: 300%;
    font-size: 4vw;  /* Scaled smoothly relative to the browser width */
    border-radius: 3rem;
    box-sizing: border-box;
}
#enter-credit{
    position: absolute;
    background-color: chartreuse;
left: 60.3%;     /* Adjusted from 743px */
top: 36.4%;      /* Adjusted from 211px */
width: 15.0%;    /* Adjust this percentage as needed */
height: 7.0%;    /* Adjust this percentage as needed */
border-radius: 1rem;
font-size: 1.3rem;   /* Adjust this percentage as needed */

}
#creditbtn-next{
    position: absolute;
    left: 40.3%;     /* Adjusted from 696px */
    top: 70.7%;      /* Adjusted from 790px */
    width: 10.7%;     /* Responsive width */
    height: 8.3%;    /* Responsive height */
    background-color: red;
    color: white;
    font-size: 2vw;  /* Scaled smoothly relative to the browser width */
    border-radius: 30rem;
    box-sizing: border-box;
}
#processing{
position: absolute;
left: 30.3%;     /* Adjusted from 535px */
top: 50.2%;      /* Adjusted from 339px */
width: 30.0%;    /* Adjust this percentage as needed */
height: 30.0%;    /* Adjust this percentage as needed */
border-radius: 1rem;
display: none; 
}

#processing[status="show"] {
    display: block;
}

    </style>
</head>
<body class="creditpg">
    <div class="atm-container">
        <img src="credit.png" id="atmScreen">
        <div><h1 id="credit-text">Enter the amount to Credit:</h1>
        <input type="number" class="creditpg" id="enter-credit" placeholder="₹"></div>
        <button id="creditbtn-next">Next</button>
        <img src="processing-credit.png" id="processing">
    </div>
</body>
<script src="app.js"></script>
<script>
        document.querySelector("#processing").setAttribute("status", "hidden");
document.querySelector("#creditbtn-next").addEventListener("click", async () => {
    let balanceInput = document.querySelector("#enter-credit").value;

    if (balanceInput > 0 && balanceInput !== "") {
       
        let balance = (Number(localStorage.getItem("mySavedNumber")) || 0) +
                      (Number(document.querySelector("#enter-credit").value) || 0);
        
        localStorage.setItem("mySavedNumber", balance);
        
        document.querySelector("#processing").setAttribute("status", "show");
        await new Promise(r => setTimeout(r, 3000));
        document.querySelector("#processing").setAttribute("status", "hidden");
        
        window.location.href = "recipt.html";
    }
    else {
        alert("Please enter a valid amount greater than 0.");
    }
});

</script>
</html>
